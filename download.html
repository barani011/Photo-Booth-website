<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Your LumaBooth Photo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: #121113;
      color: #f5f3f5;
      font-family: "Segoe UI", sans-serif;
    }
    main { width: min(100%, 520px); text-align: center; }
    h1 { margin: 0 0 20px; font-size: 24px; }
    img {
      display: block;
      max-width: 100%;
      max-height: 68vh;
      margin: 0 auto 20px;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 16px 48px #0008;
    }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: 6px;
      background: #d82b6b;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    #download-error { color: #ffb4c8; }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
  <main>
    <h1>Your LumaBooth Photo</h1>
    <img id="photo-preview" alt="Your finished photo" hidden>
    <p id="download-error" role="status" hidden>This download link is invalid or the photo is no longer available.</p>
    <a id="download-link" hidden>Download photo</a>
  </main>
  <script>
    const searchParams = new URLSearchParams(window.location.search);
    const eventFolder = searchParams.get('event') || '';
    const filename = searchParams.get('file') || '';
    const cloudUrl = searchParams.get('url') || '';
    const validEventFolder = /^[a-z0-9]+(?:-[a-z0-9]+)*(?:--[a-z0-9]+(?:-[a-z0-9]+)*)$/.test(eventFolder);
    const validFilename = /^photo-[a-z0-9][a-z0-9-]{0,47}-\d{13}-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.(?:jpg|png)$/.test(filename);
    function isValidCloudPhotoUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:'
          && /^[a-z0-9-]+\.supabase\.co$/.test(url.hostname)
          && /^\/storage\/v1\/object\/public\/booth-photo\/[a-zA-Z0-9/_-]+\.jpg$/.test(url.pathname);
      } catch {
        return false;
      }
    }

    if (isValidCloudPhotoUrl(cloudUrl)) {
      const preview = document.getElementById('photo-preview');
      const downloadLink = document.getElementById('download-link');
      preview.src = cloudUrl;
      preview.onload = () => {
        preview.hidden = false;
        downloadLink.href = `${cloudUrl}?download=lumabooth-photo.jpg`;
        downloadLink.download = 'lumabooth-photo.jpg';
        downloadLink.hidden = false;
      };
      preview.onerror = () => {
        document.getElementById('download-error').hidden = false;
      };
    } else if (validEventFolder && validFilename) {
      const encodedEventFolder = encodeURIComponent(eventFolder);
      const encodedFilename = encodeURIComponent(filename);
      const preview = document.getElementById('photo-preview');
      const downloadLink = document.getElementById('download-link');
      preview.src = `/photos/${encodedEventFolder}/${encodedFilename}`;
      preview.onload = () => {
        preview.hidden = false;
        downloadLink.href = `/api/photos/${encodedEventFolder}/${encodedFilename}`;
        downloadLink.download = filename;
        downloadLink.hidden = false;
      };
      preview.onerror = () => {
        document.getElementById('download-error').hidden = false;
      };
    } else {
      document.getElementById('download-error').hidden = false;
    }
  </script>
</body>
</html>
