<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapNest - Photo Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #171618;
      --panel: #222125;
      --line: #38363d;
      --muted: #aaa7af;
      --pink: #f85b00;
      --pink-hover: #bf205b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      color: #f3f1f5;
      font-family: Inter, "Segoe UI", sans-serif;
    }

    button, a { font: inherit; }

    .titlebar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid #29272c;
      background: #121113;
      color: #d7d4da;
      font-size: 13px;
    }

    .brand-mark {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 5px;
      background: var(--pink);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    main {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 34px clamp(18px, 4vw, 56px) 56px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .heading-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    h1 { margin: 0; font-size: 24px; font-weight: 650; }

    #photo-count { color: var(--muted); font-size: 13px; }

    .toolbar-actions { display: flex; align-items: center; gap: 10px; }

    .toolbar-button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid #4b4850;
      border-radius: 6px;
      background: #27252a;
      color: #f3f1f5;
      cursor: pointer;
      text-decoration: none;
    }

    .toolbar-button:hover { background: #343137; }

    .toolbar-button.primary {
      border-color: var(--pink);
      background: var(--pink);
    }

    .toolbar-button.primary:hover { background: var(--pink-hover); }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .photo-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
    }

    .photo-preview {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: #101012;
      cursor: zoom-in;
    }

    .photo-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-info { padding: 12px; }

    .photo-date {
      overflow: hidden;
      color: #e4e1e7;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .photo-actions { display: flex; gap: 8px; margin-top: 10px; }

    .photo-actions button, .photo-actions a {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid #4b4850;
      border-radius: 5px;
      background: transparent;
      color: #eeeaf1;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .photo-actions button:hover, .photo-actions a:hover { background: #343137; }
    .photo-actions .delete-photo { margin-left: auto; color: #ff9ab9; }

    .empty-state {
      display: grid;
      min-height: 280px;
      place-content: center;
      gap: 12px;
      border: 1px dashed #48454d;
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong { color: #f3f1f5; font-size: 17px; }
    .empty-state[hidden] { display: none; }

    dialog {
      width: min(94vw, 1100px);
      max-width: none;
      max-height: 92vh;
      padding: 12px;
      border: 1px solid #4b4850;
      border-radius: 8px;
      background: #171618;
    }

    dialog::backdrop { background: rgba(0, 0, 0, 0.82); }

    dialog img {
      display: block;
      max-width: 100%;
      max-height: calc(92vh - 24px);
      margin: 0 auto;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-actions { width: 100%; }
      .toolbar-button { flex: 1; text-align: center; }
      .photo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .photo-actions { flex-wrap: wrap; }
    }
    /* Selection controls */
.selection-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.photo-select {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 5;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--pink);
}

.photo-preview-wrapper {
  position: relative;
}

.photo-card.selected {
  border-color: var(--pink);
  box-shadow: 0 0 0 1px var(--pink);
}

.toolbar-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.toolbar-button:disabled:hover {
  background: #27252a;
}

@media (max-width: 900px) {
  .toolbar-actions {
    flex-wrap: wrap;
  }
}

@media (max-width: 600px) {
  .toolbar-actions {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
  }

  .toolbar-button {
    width: 100%;
  }
}
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
  <header class="titlebar">
    <span class="brand-mark" aria-hidden="true">LB</span>
    <span>SnapNest - Photo Gallery</span>
  </header>

  <main>
    <div class="toolbar">
  <div class="heading-row">
    <h1>Photo Gallery</h1>
    <span id="photo-count" role="status" aria-live="polite">Loading photos...</span>
  </div>

  <div class="toolbar-actions">
    <button
      id="select-all-button"
      class="toolbar-button"
      type="button"
      onclick="toggleSelectAll()">
      Select All
    </button>

    <button
      id="download-selected-button"
      class="toolbar-button"
      type="button"
      onclick="downloadSelectedPhotos()"
      disabled>
      Download Selected
    </button>

    <button
      id="delete-selected-button"
      class="toolbar-button"
      type="button"
      onclick="deleteSelectedPhotos()"
      disabled>
      Delete Selected
    </button>

    <button
      class="toolbar-button"
      type="button"
      onclick="goBackToBooth()">
      Back
    </button>

    <a class="toolbar-button primary" href="share.html">Done</a>
  </div>
</div>

    <div id="photo-grid" class="photo-grid" aria-live="polite"></div>
    <div id="empty-state" class="empty-state" hidden>
      <strong>No photos yet</strong>
      <span>Photos you capture will appear here.</span>
      <a class="toolbar-button primary" href="capture.html">Take a photo</a>
    </div>
  </main>

  <dialog id="photo-preview-dialog" aria-label="Photo preview">
    <img id="photo-preview-image" alt="Full-size photo preview">
  </dialog>

  <script>
    const DB_NAME = 'lumabooth_db';
    const DB_VERSION = 2;
    const PHOTO_ASSET_STORE = 'photo_assets';
    const LATEST_PHOTO_ID = 'last-captured-photo';

    let photoDatabase = null;
    let photos = [];

    const selectedPhotoIds = new Set();

function updateSelectionControls() {
  const selectedCount = selectedPhotoIds.size;
  const totalCount = photos.length;

  const selectAllButton = document.getElementById('select-all-button');
  const downloadButton = document.getElementById('download-selected-button');
  const deleteButton = document.getElementById('delete-selected-button');

  if (!selectAllButton || !downloadButton || !deleteButton) return;

  downloadButton.disabled = selectedCount === 0;
  deleteButton.disabled = selectedCount === 0;

  if (totalCount === 0) {
    selectAllButton.textContent = 'Select All';
    selectAllButton.disabled = true;
    return;
  }

  selectAllButton.disabled = false;

  if (selectedCount === totalCount) {
    selectAllButton.textContent = 'Deselect All';
  } else {
    selectAllButton.textContent = 'Select All';
  }
}

function togglePhotoSelection(photoId, checked) {
  if (checked) {
    selectedPhotoIds.add(photoId);
  } else {
    selectedPhotoIds.delete(photoId);
  }

  const card = document.querySelector(
    `.photo-card[data-photo-id="${CSS.escape(String(photoId))}"]`
  );

  if (card) {
    card.classList.toggle('selected', checked);
  }

  updateSelectionControls();
}

function toggleSelectAll() {
  if (photos.length === 0) return;

  const allSelected = selectedPhotoIds.size === photos.length;

  selectedPhotoIds.clear();

  if (!allSelected) {
    photos.forEach(photo => {
      selectedPhotoIds.add(photo.id);
    });
  }

  renderPhotos();
}

async function deleteSelectedPhotos() {
  const selectedPhotos = photos.filter(photo =>
    selectedPhotoIds.has(photo.id)
  );

  if (selectedPhotos.length === 0) return;

  const confirmed = window.confirm(
    `Delete ${selectedPhotos.length} selected ${
      selectedPhotos.length === 1 ? 'photo' : 'photos'
    } from the gallery?`
  );

  if (!confirmed) return;

  try {
    const transaction = photoDatabase.transaction(
      PHOTO_ASSET_STORE,
      'readwrite'
    );

    const store = transaction.objectStore(PHOTO_ASSET_STORE);

    selectedPhotos.forEach(photo => {
      store.delete(photo.id);
    });

    await new Promise((resolve, reject) => {
      transaction.oncomplete = resolve;
      transaction.onerror = () =>
        reject(transaction.error || new Error('Could not delete photos.'));
      transaction.onabort = () =>
        reject(transaction.error || new Error('Photo deletion was aborted.'));
    });

    selectedPhotos.forEach(photo => {
      selectedPhotoIds.delete(photo.id);
    });

    photos = photos.filter(photo => !selectedPhotoIds.has(photo.id));

    // Recalculate using IDs that were deleted.
    const deletedIds = new Set(selectedPhotos.map(photo => photo.id));
    photos = photos.filter(photo => !deletedIds.has(photo.id));

    selectedPhotoIds.clear();

    // Update latest photo record.
    const latestTransaction = photoDatabase.transaction(
      PHOTO_ASSET_STORE,
      'readwrite'
    );

    const latestStore = latestTransaction.objectStore(PHOTO_ASSET_STORE);

    const latestRequest = latestStore.get(LATEST_PHOTO_ID);

    latestRequest.onsuccess = () => {
      const latest = latestRequest.result;

      if (latest && deletedIds.has(latest.galleryRecordId)) {
        const replacement = photos[0];

        if (replacement) {
          latestStore.put({
            id: LATEST_PHOTO_ID,
            galleryRecordId: replacement.id,
            capturedAt: replacement.capturedAt
          });
        } else {
          latestStore.delete(LATEST_PHOTO_ID);
        }
      }
    };

    renderPhotos();

  } catch (error) {
    alert(`Could not delete selected photos: ${error.message}`);
  }
}

async function downloadSelectedPhotos() {
  const selectedPhotos = photos.filter(photo =>
    selectedPhotoIds.has(photo.id)
  );

  if (selectedPhotos.length === 0) return;

  const confirmed = window.confirm(
    `Download ${selectedPhotos.length} selected ${
      selectedPhotos.length === 1 ? 'photo' : 'photos'
    }?`
  );

  if (!confirmed) return;

  for (let i = 0; i < selectedPhotos.length; i++) {
    const photo = selectedPhotos[i];

    const link = document.createElement('a');
    link.href = photo.data;
    link.download = `lumabooth-${photo.id}.jpg`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    // Small delay helps the browser process multiple downloads.
    await new Promise(resolve => setTimeout(resolve, 150));
  }
}

    function openPhotoDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('templates')) db.createObjectStore('templates', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('design_drafts')) db.createObjectStore('design_drafts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains(PHOTO_ASSET_STORE)) db.createObjectStore(PHOTO_ASSET_STORE, { keyPath: 'id' });
        };
        request.onerror = () => reject(request.error || new Error('Photo storage could not be opened.'));
        request.onsuccess = () => resolve(request.result);
      });
    }

    function loadPhotos() {
      return new Promise((resolve, reject) => {
        if (!photoDatabase) return reject(new Error('Photo storage is not ready.'));
        const transaction = photoDatabase.transaction(PHOTO_ASSET_STORE, 'readonly');
        const request = transaction.objectStore(PHOTO_ASSET_STORE).getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error || new Error('Photos could not be loaded.'));
      });
    }

    function renderPhotos() {
  const grid = document.getElementById('photo-grid');
  const emptyState = document.getElementById('empty-state');

  grid.replaceChildren();

  document.getElementById('photo-count').textContent =
    `${photos.length} ${photos.length === 1 ? 'photo' : 'photos'}`;

  emptyState.hidden = photos.length > 0;

  photos.forEach((photo) => {
    const card = document.createElement('article');
    card.className = 'photo-card';
    card.dataset.photoId = photo.id;

    const isSelected = selectedPhotoIds.has(photo.id);

    if (isSelected) {
      card.classList.add('selected');
    }

    /* Image wrapper */
    const previewWrapper = document.createElement('div');
    previewWrapper.className = 'photo-preview-wrapper';

    /* Checkbox */
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'photo-select';
    checkbox.checked = isSelected;
    checkbox.setAttribute(
      'aria-label',
      `Select photo from ${formatPhotoDate(photo.capturedAt)}`
    );

    checkbox.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    checkbox.addEventListener('change', () => {
      togglePhotoSelection(photo.id, checkbox.checked);
    });

    /* Preview button */
    const previewButton = document.createElement('button');
    previewButton.className = 'photo-preview';
    previewButton.type = 'button';
    previewButton.setAttribute(
      'aria-label',
      `Preview photo from ${formatPhotoDate(photo.capturedAt)}`
    );

    const image = document.createElement('img');

    image.src = photo.data;
    image.alt =
      `Captured photo from ${formatPhotoDate(photo.capturedAt)}`;

    previewButton.appendChild(image);

    previewButton.addEventListener('click', () => {

      // Store selected photo and capture session.
      sessionStorage.setItem(
        'lumabooth_selected_share_photo',
        JSON.stringify({
          id: photo.id,
          data: photo.data,
          captureSessionId: photo.captureSessionId || null,
          cameraNumber: photo.cameraNumber || 1
        })
      );

      // Clear previous final rendered photo.
      sessionStorage.removeItem(
        'lumabooth_final_photo_result_v1'
      );

      sessionStorage.removeItem(
        'lumabooth_cloud_upload_error_v1'
      );

      sessionStorage.removeItem(
        'lumabooth_cloud_upload_failures_v1'
      );

      window.location.href = 'share.html';
    });

    previewWrapper.append(
      checkbox,
      previewButton
    );

    /* Photo information */
    const info = document.createElement('div');
    info.className = 'photo-info';

    const date = document.createElement('div');
    date.className = 'photo-date';
    date.textContent = formatPhotoDate(photo.capturedAt);

    /* Individual actions */
    const actions = document.createElement('div');
    actions.className = 'photo-actions';

    const download = document.createElement('a');

    download.href = photo.data;
    download.download = `lumabooth-${photo.id}.jpg`;
    download.textContent = 'Download';

    const remove = document.createElement('button');

    remove.className = 'delete-photo';
    remove.type = 'button';
    remove.textContent = 'Delete';

    remove.addEventListener('click', () => {
      deletePhoto(photo);
    });

    actions.append(
      download,
      remove
    );

    info.append(
      date,
      actions
    );

    card.append(
      previewWrapper,
      info
    );

    grid.appendChild(card);
  });

  updateSelectionControls();
}

    function formatPhotoDate(timestamp) {
      return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' })
        .format(new Date(timestamp));
    }

    function showPhotoPreview(source) {
      document.getElementById('photo-preview-image').src = source;
      document.getElementById('photo-preview-dialog').showModal();
    }

    async function deletePhoto(photo) {
  if (!window.confirm('Delete this photo from the gallery?')) return;

  try {
    const transaction = photoDatabase.transaction(
      PHOTO_ASSET_STORE,
      'readwrite'
    );

    const store = transaction.objectStore(PHOTO_ASSET_STORE);

    store.delete(photo.id);

    const latestRequest = store.get(LATEST_PHOTO_ID);

    latestRequest.onsuccess = () => {
      if (latestRequest.result?.galleryRecordId === photo.id) {
        const replacement = photos.find(
          item => item.id !== photo.id
        );

        if (replacement) {
          store.put({
            id: LATEST_PHOTO_ID,
            galleryRecordId: replacement.id,
            capturedAt: replacement.capturedAt
          });
        } else {
          store.delete(LATEST_PHOTO_ID);
        }
      }
    };

    transaction.oncomplete = () => {
      selectedPhotoIds.delete(photo.id);

      photos = photos.filter(
        item => item.id !== photo.id
      );

      renderPhotos();
    };

    transaction.onerror = () => {
      document.getElementById('photo-count').textContent =
        'Could not delete photo';
    };

  } catch (error) {
    alert(`Could not delete photo: ${error.message}`);
  }
}

    async function goBackToBooth() {
      if (history.length > 1) history.back();
      else window.location.href = 'template.html';
    }

    document.getElementById('photo-preview-dialog').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) event.currentTarget.close();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        photoDatabase = await openPhotoDatabase();
        photos = (await loadPhotos())
          .filter((photo) => photo.id !== LATEST_PHOTO_ID && photo.data)
          .sort((first, second) => second.capturedAt - first.capturedAt);
        renderPhotos();
      } catch(error) {
        document.getElementById('photo-count').textContent = 'Photo storage unavailable';
        document.getElementById('empty-state').hidden = false;
        document.querySelector('#empty-state span').textContent = error.message;
      }
    });
  </script>
  <script src="kiosk-lock.js"></script>
</body>
</html>
