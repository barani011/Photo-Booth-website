    /* Print media query: prints only the final composite strip cleanly */
    
/* Print using the paper size saved in Photo Layout */
#print-copies {
  display: none;
}

@media print {
  @page {
    margin: 0;
  }

  html,
  body {
    width: auto !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    display: block !important;
    background: #fff !important;
  }

  body * {
    visibility: hidden !important;
  }

  body > :not(#print-copies) {
    display: none !important;
  }

  #print-copies,
  #print-copies * {
    visibility: visible !important;
  }

  #print-copies {
    display: block !important;
    width: var(--print-width) !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .print-copy-page {
    display: flex !important;
    width: var(--print-width) !important;
    height: var(--print-height) !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    break-after: page;
    page-break-after: always;
  }

  .print-copy-page:last-child {
    break-after: auto !important;
    page-break-after: auto !important;
  }

  .print-copy-artwork {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    object-fit: fill !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    flex: none !important;
  }
}

  <script type="module">
    const ACTIVE_KEY = 'lumabooth_active_template_v2';
    const ACTIVE_ID_KEY = 'lumabooth_active_template_id_v1';
    const STORAGE_KEY = 'lumabooth_saved_templates_v2';
    const DB_NAME = 'lumabooth_db';
    const DB_VERSION = 2;
    const PHOTO_ASSET_STORE = 'photo_assets';
    const CAPTURED_PHOTO_ID = 'last-captured-photo';
    const CAPTURE_PHOTO_IDS_KEY = 'lumabooth_capture_photo_ids_v1';
    const FINAL_PHOTO_RESULT_KEY = 'lumabooth_final_photo_result_v1';
    const ACTIVE_EVENT_KEY = 'lumabooth_active_event_v1';
    let savedFinalPhoto = null;

    document.getElementById('open-print-quantity').addEventListener('click', () => {
      document.getElementById('print-quantity-dialog').showModal();
      document.getElementById('print-quantity').focus();
    });
    document.getElementById('cancel-print-quantity').addEventListener('click', () => {
      document.getElementById('print-quantity-dialog').close();
    });
    document.getElementById('print-quantity-form').addEventListener('submit', event => {
      event.preventDefault();
      const quantityInput = document.getElementById('print-quantity');
      const quantity = Math.min(20, Math.max(1, Number.parseInt(quantityInput.value, 10) || 1));
      quantityInput.value = String(quantity);
      document.getElementById('print-quantity-dialog').close();
      printPhotoCopies(quantity);
    });

    function loadDatabaseRecord(storeName, key) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('templates')) db.createObjectStore('templates', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('design_drafts')) db.createObjectStore('design_drafts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains(PHOTO_ASSET_STORE)) db.createObjectStore(PHOTO_ASSET_STORE, { keyPath: 'id' });
        };
        request.onerror = () => reject(request.error || new Error('Database could not be opened.'));
        request.onsuccess = () => {
          const db = request.result;
          try {
            const transaction = db.transaction(storeName, 'readonly');
            const recordRequest = transaction.objectStore(storeName).get(key);
            recordRequest.onsuccess = () => { db.close(); resolve(recordRequest.result || null); };
            recordRequest.onerror = () => { db.close(); reject(recordRequest.error); };
          } catch(error) {
            db.close();
            reject(error);
          }
        };
      });
    }

    async function loadAllPhotoRecords() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onerror = () => {
          reject(request.error || new Error('Photo database could not be opened.'));
        };

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('templates')) {
            db.createObjectStore('templates', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('design_drafts')) {
            db.createObjectStore('design_drafts', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains(PHOTO_ASSET_STORE)) {
            db.createObjectStore(PHOTO_ASSET_STORE, { keyPath: 'id' });
          }
        };

        request.onsuccess = () => {
          const db = request.result;

          try {
            if (!db.objectStoreNames.contains(PHOTO_ASSET_STORE)) {
              db.close();
              reject(new Error(`IndexedDB store "${PHOTO_ASSET_STORE}" was not found.`));
              return;
            }

            const transaction = db.transaction(PHOTO_ASSET_STORE, 'readonly');
            const store = transaction.objectStore(PHOTO_ASSET_STORE);
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = () => {
              const records = getAllRequest.result || [];
              db.close();
              resolve(records);
            };

            getAllRequest.onerror = () => {
              const error = getAllRequest.error || new Error('Photos could not be loaded.');
              db.close();
              reject(error);
            };
          } catch (error) {
            db.close();
            reject(error);
          }
        };
      });
    }

    async function loadShareData() {
  let savedPhoto = null;
  const photosByCamera = new Map();
  let template = null;

  // ============================================================
  // 1. CHECK IF A PHOTO WAS SELECTED FROM GALLERY
  // ============================================================

  let selectedGalleryPhoto = null;

  try {
    const selectedRaw = sessionStorage.getItem(
      'lumabooth_selected_share_photo'
    );

    if (selectedRaw) {
      try {
        selectedGalleryPhoto = JSON.parse(selectedRaw);
      } catch (e) {
        // Old format compatibility
        selectedGalleryPhoto = {
          data: selectedRaw,
          captureSessionId: null,
          cameraNumber: 1
        };
      }
    }
  } catch (e) {
    selectedGalleryPhoto = null;
  }


  // ============================================================
  // 2. IF GALLERY PHOTO WAS SELECTED
  //    LOAD ALL PHOTOS FROM THE SAME CAPTURE SESSION
  // ============================================================

  if (
    selectedGalleryPhoto &&
    selectedGalleryPhoto.captureSessionId
  ) {

    try {

      const allPhotos = await loadAllPhotoRecords();

      const selectedSessionId =
        selectedGalleryPhoto.captureSessionId;

      // Get every photo belonging to the same capture
      const sessionPhotos = allPhotos
        .filter(photo =>
          photo.id !== CAPTURED_PHOTO_ID &&
          photo.id !== 'last-captured-photo' &&
          photo.data &&
          photo.captureSessionId === selectedSessionId
        )
        .sort((a, b) =>
          Number(a.cameraNumber || 0) -
          Number(b.cameraNumber || 0)
        );


      console.log(
        'Selected capture session:',
        selectedSessionId
      );

      console.log(
        'Photos found in session:',
        sessionPhotos
      );


      // Put every photo into its correct camera slot
      sessionPhotos.forEach(photo => {

        const cameraNumber =
          String(photo.cameraNumber || 1);

        photosByCamera.set(
          cameraNumber,
          photo.data
        );

      });


      // Selected photo as fallback
      savedPhoto =
        selectedGalleryPhoto.data || null;


    } catch (error) {

      console.error(
        'Could not load photos from selected capture session:',
        error
      );

    }
  }


  // ============================================================
  // 3. OLD GALLERY SELECTION FALLBACK
  // ============================================================

  if (
    selectedGalleryPhoto?.data &&
    photosByCamera.size === 0
  ) {

    savedPhoto =
      selectedGalleryPhoto.data;

    photosByCamera.set(
      String(
        selectedGalleryPhoto.cameraNumber || 1
      ),
      selectedGalleryPhoto.data
    );
  }


  // ============================================================
  // 4. NORMAL CAPTURE FLOW
  //    Used when coming directly from capture.html
  // ============================================================

  if (
    !selectedGalleryPhoto?.captureSessionId
  ) {

    try {

      const photoIds = JSON.parse(
        sessionStorage.getItem(
          CAPTURE_PHOTO_IDS_KEY
        ) || '[]'
      );

      for (const photoId of photoIds) {

        const photoRecord =
          await loadDatabaseRecord(
            PHOTO_ASSET_STORE,
            photoId
          );

        if (photoRecord?.data) {

          photosByCamera.set(
            String(
              photoRecord.cameraNumber ||
              photosByCamera.size + 1
            ),
            photoRecord.data
          );

        }
      }

    } catch (e) {

      console.warn(
        'Could not load capture photos:',
        e
      );

    }


    // Latest captured photo fallback
    if (photosByCamera.size === 0) {

      try {

        const photoRecord =
          await loadDatabaseRecord(
            PHOTO_ASSET_STORE,
            CAPTURED_PHOTO_ID
          );

        if (photoRecord?.galleryRecordId) {

          const latestPhoto =
            await loadDatabaseRecord(
              PHOTO_ASSET_STORE,
              photoRecord.galleryRecordId
            );

          savedPhoto =
            latestPhoto?.data || null;

        } else {

          savedPhoto =
            photoRecord?.data || null;

        }

      } catch (e) {}
    }


    // Old fallback
    if (!savedPhoto) {

      try {

        savedPhoto =
          sessionStorage.getItem(
            'lastCapturedPhoto'
          );

      } catch (e) {}

    }
  }


  // ============================================================
  // 5. LOAD ACTIVE TEMPLATE
  // ============================================================

  try {

    const activeRaw =
      localStorage.getItem(ACTIVE_KEY);

    if (activeRaw) {

      template =
        JSON.parse(activeRaw);

    }

  } catch (e) {}


  // ============================================================
  // 6. LOAD TEMPLATE FROM INDEXEDDB
  // ============================================================

  if (!template) {

    try {

      const activeId =
        localStorage.getItem(
          ACTIVE_ID_KEY
        );

      if (activeId) {

        template =
          await loadDatabaseRecord(
            'templates',
            activeId
          );

      }

    } catch (e) {}
  }


  // ============================================================
  // 7. FALLBACK TO SAVED TEMPLATE
  // ============================================================

  if (!template) {

    try {

      const listRaw =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (listRaw) {

        const templates =
          JSON.parse(listRaw);

        template =
          templates[0] || null;

      }

    } catch (e) {}
  }


  // ============================================================
  // 8. FINAL FALLBACK PHOTO
  // ============================================================

  if (
    savedPhoto &&
    photosByCamera.size === 0
  ) {

    photosByCamera.set(
      '1',
      savedPhoto
    );

  }


  // ============================================================
  // 9. PREVIEW IMAGE
  // ============================================================

  const previewPhoto =
    photosByCamera.values().next().value ||
    savedPhoto;

  if (previewPhoto) {

    const preview =
      document.getElementById(
        'polaroid-preview-img'
      );

    if (preview) {

      preview.src =
        previewPhoto;

    }

  }


  // ============================================================
  // 10. DEBUG
  // ============================================================

  console.log(
    'Photos by camera:',
    Object.fromEntries(photosByCamera)
  );

  console.log(
    'Template:',
    template
  );


  // ============================================================
  // 11. RENDER COMPLETE TEMPLATE
  // ============================================================

  renderExactTemplate(
    template,
    photosByCamera
  );


  // ============================================================
  // 12. SAVE FINAL COMBINED PHOTO ONLY FOR A NEW CAPTURE
  // ============================================================
  // If the user came from Gallery, this is an OLD photo.
  // Do NOT create/upload another database record.
  // Only a fresh capture should be saved.

  const isGallerySelection = !!selectedGalleryPhoto;

  if (template && !isGallerySelection) {
    await saveFinalPhoto(
      template,
      photosByCamera
    );
  } else if (isGallerySelection) {
    const existingResult = JSON.parse(
      sessionStorage.getItem(FINAL_PHOTO_RESULT_KEY) || 'null'
    );

    if (existingResult) {
      showSavedPhotoResult(existingResult);
    } else {
      document.getElementById('final-photo-status').textContent =
        'Viewing saved gallery photo';
    }
  }
}

    window.addEventListener('DOMContentLoaded', loadShareData);

    function renderExactTemplate(tpl, photosByCamera) {
      const container = document.getElementById('dynamic-rendered-strip');
      if (!tpl) {
        container.innerHTML = `<div class="p-8 text-black text-center">No template found.</div>`;
        return;
      }

      // Calculate proportional scale to fit comfortably in viewport
      const baseW = tpl.artboardWidth || 380;
      const baseH = tpl.artboardHeight || 570;
      const maxContainerH = window.innerHeight - 130;
      const scale = Math.min(1, maxContainerH / baseH);

      const renderW = Math.round(baseW * scale);
      const renderH = Math.round(baseH * scale);

      container.style.width = `${renderW}px`;
      container.style.height = `${renderH}px`;
      container.style.backgroundColor = tpl.bg || '#ffffff';
      container.innerHTML = '';

      // Red plaid patterned background if applicable
      if (tpl.themePattern === 'plaid-red' || tpl.bg === '#882236' || tpl.bg === '#922b3e') {
        container.style.backgroundColor = '#882236';
        container.style.backgroundImage = `
          repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 20px, transparent 20px, transparent 40px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 20px, transparent 20px, transparent 40px)
        `;
      }

      const layers = tpl.layers || [];

      // Render layers from bottom to top (in reverse order matching editor stacking)
      for (let i = layers.length - 1; i >= 0; i--) {
        const l = layers[i];
        if (!l.visible) continue;

        const layerEl = document.createElement('div');
        layerEl.style.position = 'absolute';
        layerEl.style.left = `${Math.round(l.x * scale)}px`;
        layerEl.style.top = `${Math.round(l.y * scale)}px`;
        layerEl.style.width = `${Math.round(l.w * scale)}px`;
        layerEl.style.height = `${Math.round(l.h * scale)}px`;
        layerEl.style.transform = `rotate(${l.rot || 0}deg)`;
        layerEl.style.transformOrigin = 'center center';
        layerEl.style.overflow = 'hidden';

        if (l.type === 'camera') {
          layerEl.style.border = '2.5px solid #ffffff';
          layerEl.style.backgroundColor = '#000000';
          const photoSrc = photosByCamera.get(String(l.cameraNumber || 1));

          if (photoSrc) {
            layerEl.innerHTML = `<img src="${photoSrc}" class="w-full h-full object-cover" alt="Captured photo">`;
          } else {
            // Silhouette fallback if camera was skipped
            layerEl.style.backgroundColor = l.bg || '#8ea352';
            layerEl.innerHTML = `<div class="w-full h-full flex items-center justify-center font-bold text-white text-3xl">${l.cameraNumber || 1}</div>`;
          }
        } else if (l.type === 'image' && l.src) {
          // Uploaded frame / overlay image / PNG artwork
          layerEl.innerHTML = `<img src="${l.src}" class="w-full h-full object-contain pointer-events-none" alt="">`;
        } else if (l.type === 'text') {
          // Text label
          layerEl.style.color = l.color || '#d82b6b';
          layerEl.style.fontSize = `${Math.max(10, Math.round((l.fontSize || 22) * scale))}px`;
          layerEl.style.fontWeight = 'bold';
          layerEl.style.display = 'flex';
          layerEl.style.alignItems = 'center';
          layerEl.style.justifyContent = 'center';
          layerEl.textContent = l.text || '';
        }

        container.appendChild(layerEl);
      }
    }

    
function getSavedPaperSizeMm(template) {
  const paperSizes = {
    '2x6': [2, 6],
    '4x6': [4, 6],
    '5x7': [5, 7],
    '6x8': [6, 8],
    '6x6': [6, 6],
    '8x10': [8, 10],
    A4: [210 / 25.4, 297 / 25.4],
    A5: [148 / 25.4, 210 / 25.4],
    A6: [105 / 25.4, 148 / 25.4],
    A7: [74 / 25.4, 105 / 25.4]
  };

  const resolution = Number(template.resolution) || 300;

  // Use the custom dimensions saved by the design editor.
  let [width, height] =
    template.paperSize === 'Custom'
      ? [
          (Number(template.customPaperWidth) || 1200) / resolution,
          (Number(template.customPaperHeight) || 1800) / resolution
        ]
      : (paperSizes[template.paperSize] || paperSizes['4x6']);

  const orientation =
    template.orientation ||
    ((Number(template.artboardWidth) || 380) >
    (Number(template.artboardHeight) || 570)
      ? 'Horizontal'
      : 'Vertical');

  if (
    (orientation === 'Horizontal' && height > width) ||
    (orientation === 'Vertical' && width > height)
  ) {
    [width, height] = [height, width];
  }

  // Convert inches to millimetres.
  return {
    width: width * 25.4,
    height: height * 25.4
  };
}

function getFinalImageDimensions(template) {
  const paper = getSavedPaperSizeMm(template);
  const resolution = Number(template.resolution) || 300;
  return {
    width: Math.round((paper.width / 25.4) * resolution),
    height: Math.round((paper.height / 25.4) * resolution)
  };
}

async function printPhotoCopies(quantity) {
  const printCopies = document.getElementById('print-copies');

  try {
    printCopies.replaceChildren();

    // Read the active template saved by Photo Layout.
    let template = null;

    try {
      template = JSON.parse(
        localStorage.getItem('lumabooth_active_template_v2') || 'null'
      );
    } catch (error) {
      console.warn('Could not read active template:', error);
    }

    // Fallback to the selected template in IndexedDB.
    if (!template) {
      const activeId = localStorage.getItem(
        'lumabooth_active_template_id_v1'
      );

      if (activeId) {
        template = await loadDatabaseRecord('templates', activeId);
      }
    }

    if (!template) {
      throw new Error('No saved photo layout was found.');
    }

    // Get the saved paper size and orientation.
    const paper = getSavedPaperSizeMm(template);

    // Set the actual physical page size in Chrome print preview.
    let printStyle = document.getElementById(
      'dynamic-print-page-style'
    );

    if (!printStyle) {
      printStyle = document.createElement('style');
      printStyle.id = 'dynamic-print-page-style';
      document.head.appendChild(printStyle);
    }

    printStyle.textContent = `
      @page {
        size: ${paper.width}mm ${paper.height}mm;
        margin: 0;
      }
    `;

    printCopies.style.setProperty(
      '--print-width',
      `${paper.width}mm`
    );

    printCopies.style.setProperty(
      '--print-height',
      `${paper.height}mm`
    );

    // Load all captured photos from IndexedDB.
    const photosByCamera = new Map();

    const photoIds = JSON.parse(
      sessionStorage.getItem(
        'lumabooth_capture_photo_ids_v1'
      ) || '[]'
    );

    for (const photoId of photoIds) {
      const record = await loadDatabaseRecord(
        'photo_assets',
        photoId
      );

      if (record?.data) {
        photosByCamera.set(
          String(record.cameraNumber || photosByCamera.size + 1),
          record.data
        );
      }
    }

    // Fallback for a single captured photo.
    if (photosByCamera.size === 0) {
      const record = await loadDatabaseRecord(
        'photo_assets',
        'last-captured-photo'
      );

      const latest = record?.galleryRecordId
        ? await loadDatabaseRecord(
            'photo_assets',
            record.galleryRecordId
          )
        : record;

      if (latest?.data) {
        photosByCamera.set(
          String(latest.cameraNumber || 1),
          latest.data
        );
      } else {
        const fallback = sessionStorage.getItem(
          'lastCapturedPhoto'
        );

        if (fallback) {
          photosByCamera.set('1', fallback);
        }
      }
    }

    // Render the original design at its saved output resolution.
    const canvas = await renderFinalPhotoCanvas(
      template,
      photosByCamera
    );

    const imageUrl = canvas.toDataURL('image/png');

    // One physical sheet per requested copy.
    for (let i = 0; i < quantity; i++) {
      const page = document.createElement('section');
      page.className = 'print-copy-page';

      const artwork = document.createElement('img');
      artwork.className = 'print-copy-artwork';
      artwork.src = imageUrl;
      artwork.alt = 'Photo layout print';

      page.appendChild(artwork);
      printCopies.appendChild(page);
    }

    // Wait for all print images to load.
    await Promise.all(
      Array.from(printCopies.querySelectorAll('img')).map(img => {
        if (img.complete && img.naturalWidth > 0) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () =>
            reject(new Error('Could not load the print image.'));
        });
      })
    );

    window.addEventListener(
      'afterprint',
      () => printCopies.replaceChildren(),
      { once: true }
    );

    window.print();

  } catch (error) {
    printCopies.replaceChildren();

    console.error('Printing failed:', error);
    alert('Unable to prepare the print: ' + error.message);
  }
}

    function loadCanvasImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('A photo or design image could not be loaded.'));
        image.src = source;
      });
    }

    function drawImageCover(context, image, x, y, width, height) {
      const scale = Math.max(width / image.width, height / image.height);
      const sourceWidth = width / scale;
      const sourceHeight = height / scale;
      const sourceX = (image.width - sourceWidth) / 2;
      const sourceY = (image.height - sourceHeight) / 2;
      context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
    }

    function drawImageContain(context, image, width, height) {
      const scale = Math.min(width / image.width, height / image.height);
      const drawWidth = image.width * scale;
      const drawHeight = image.height * scale;
      context.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
    }

    async function renderFinalPhotoCanvas(template, photosByCamera) {
      const { width, height } = getFinalImageDimensions(template);
      const artboardWidth = Number(template.artboardWidth) || 380;
      const artboardHeight = Number(template.artboardHeight) || 570;
      const artboardScale = Math.min(width / artboardWidth, height / artboardHeight);
      const scaleX = artboardScale;
      const scaleY = artboardScale;
      const offsetX = (width - artboardWidth * artboardScale) / 2;
      const offsetY = (height - artboardHeight * artboardScale) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Could not create the final image canvas.');

      context.fillStyle = template.bg || '#ffffff';
      context.fillRect(0, 0, width, height);
      if (template.themePattern === 'plaid-red' || ['#882236', '#922b3e'].includes(template.bg)) {
        context.fillStyle = '#882236';
        context.fillRect(0, 0, width, height);
        context.strokeStyle = 'rgba(255,255,255,0.08)';
        context.lineWidth = Math.max(1, Math.min(scaleX, scaleY) * 20);
        for (let y = 0; y < height; y += Math.max(1, Math.round(40 * scaleY))) {
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(width, y);
          context.stroke();
        }
        for (let x = 0; x < width; x += Math.max(1, Math.round(40 * scaleX))) {
          context.beginPath();
          context.moveTo(x, 0);
          context.lineTo(x, height);
          context.stroke();
        }
      }

      const imageCache = new Map();
      const getImage = async source => {
        if (!imageCache.has(source)) imageCache.set(source, loadCanvasImage(source));
        return imageCache.get(source);
      };
      const layers = template.layers || [];
      for (let index = layers.length - 1; index >= 0; index--) {
        const layer = layers[index];
        if (layer.visible === false) continue;

        const x = offsetX + (Number(layer.x) || 0) * scaleX;
        const y = offsetY + (Number(layer.y) || 0) * scaleY;
        const layerWidth = (Number(layer.w) || 0) * scaleX;
        const layerHeight = (Number(layer.h) || 0) * scaleY;
        context.save();
        context.translate(x + layerWidth / 2, y + layerHeight / 2);
        context.rotate((Number(layer.rot) || 0) * Math.PI / 180);
        context.translate(-layerWidth / 2, -layerHeight / 2);

        if (layer.type === 'camera') {
          const photoSource = photosByCamera.get(String(layer.cameraNumber || 1));
          if (photoSource) {
            drawImageCover(context, await getImage(photoSource), 0, 0, layerWidth, layerHeight);
          } else {
            context.fillStyle = layer.bg || '#8ea352';
            context.fillRect(0, 0, layerWidth, layerHeight);
            context.fillStyle = '#ffffff';
            context.font = `700 ${Math.max(24, Math.round(layerHeight * 0.35))}px sans-serif`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(String(layer.cameraNumber || 1), layerWidth / 2, layerHeight / 2);
          }
          context.strokeStyle = '#ffffff';
          context.lineWidth = Math.max(1, 2.5 * Math.min(scaleX, scaleY));
          context.strokeRect(0, 0, layerWidth, layerHeight);
        } else if (layer.type === 'image' && layer.src) {
          drawImageContain(context, await getImage(layer.src), layerWidth, layerHeight);
        } else if (layer.type === 'text') {
          context.fillStyle = layer.color || '#d82b6b';
          context.font = `700 ${Math.max(10, (Number(layer.fontSize) || 22) * scaleY)}px Inter, sans-serif`;
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText(layer.text || '', layerWidth / 2, layerHeight / 2, layerWidth);
        } else if (layer.type === 'shape') {
          const centerX = layerWidth / 2;
          const centerY = layerHeight / 2;
          const outerRadius = Math.min(layerWidth, layerHeight) / 2;
          const innerRadius = outerRadius * 0.42;
          context.beginPath();
          for (let point = 0; point < 10; point++) {
            const radius = point % 2 === 0 ? outerRadius : innerRadius;
            const angle = -Math.PI / 2 + point * Math.PI / 5;
            const pointX = centerX + Math.cos(angle) * radius;
            const pointY = centerY + Math.sin(angle) * radius;
            if (point === 0) context.moveTo(pointX, pointY);
            else context.lineTo(pointX, pointY);
          }
          context.closePath();
          context.strokeStyle = '#882236';
          context.lineWidth = Math.max(2, 2 * Math.min(scaleX, scaleY));
          context.stroke();
        } else if (layer.type === 'qr') {
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, layerWidth, layerHeight);
          context.fillStyle = '#000000';
          const module = Math.max(1, Math.min(layerWidth, layerHeight) / 7);
          [[0, 0], [4, 0], [0, 4], [2, 2], [5, 5]].forEach(([column, row]) => {
            context.fillRect(column * module, row * module, module * 2, module * 2);
          });
        }
        context.restore();
      }
      return canvas;
    }

    function blobFromCanvas(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('The final photo could not be encoded.')), 'image/jpeg', 0.94);
      });
    }

    function showSavedPhotoResult(result) {
      savedFinalPhoto = result;
      document.getElementById('qr-code-image').src = result.qrCodeDataUrl;
      document.getElementById('qr-download-link').href = result.downloadUrl;
      const failedCaptures = Number(sessionStorage.getItem('lumabooth_cloud_upload_failures_v1') || 0);
      const cloudError = result.cloudError || sessionStorage.getItem('lumabooth_cloud_upload_error_v1');
      const cloudStatus = result.cloudUrl
        ? failedCaptures ? ` and Supabase; ${failedCaptures} capture upload(s) failed` : ' and Supabase'
        : cloudError ? ` locally (Supabase: ${cloudError})` : ' locally (Supabase upload unavailable)';
      document.getElementById('final-photo-status').textContent = `Saved to ${result.eventName}: ${result.filename}${cloudStatus}`;
    }

    async function saveFinalPhoto(template, photosByCamera) {
      const status = document.getElementById('final-photo-status');
      status.textContent = 'Saving final photo to this computer...';
      try {
        const previousResult = JSON.parse(sessionStorage.getItem(FINAL_PHOTO_RESULT_KEY) || 'null');
        if (previousResult?.filename && previousResult?.qrCodeDataUrl && previousResult?.downloadUrl) {
          showSavedPhotoResult(previousResult);
          return;
        }

        const canvas = await renderFinalPhotoCanvas(template, photosByCamera);
        const imageBlob = await blobFromCanvas(canvas);
        const activeEvent = JSON.parse(localStorage.getItem(ACTIVE_EVENT_KEY) || 'null');
        if (!activeEvent?.id || !activeEvent?.name) throw new Error('Launch a named event before saving photos.');
        let cloudUrl = null;
        let cloudError = null;
        try {
          const { uploadPhoto } = await import('./supabase.js');
          const sessionId = sessionStorage.getItem('lumabooth_capture_session_id_v1') || `session-${crypto.randomUUID()}`;
          const cloudPhoto = await uploadPhoto(imageBlob, sessionId, activeEvent.name);
          cloudUrl = cloudPhoto.publicUrl;
        } catch(error) {
          console.warn('Final photo could not be uploaded to Supabase:', error);
          cloudError = String(error?.message || 'Upload failed').slice(0, 160);
          try { sessionStorage.setItem('lumabooth_cloud_upload_error_v1', cloudError); } catch(e) {}
        }
        const uploadQuery = new URLSearchParams({ eventId: activeEvent.id, eventName: activeEvent.name });
        if (cloudUrl) uploadQuery.set('cloudUrl', cloudUrl);
        const response = await fetch(`/api/photos?${uploadQuery}`, {
          method: 'POST',
          headers: { 'Content-Type': imageBlob.type },
          body: imageBlob
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The server could not save the final photo.');

        result.cloudError = cloudError;
        sessionStorage.setItem(FINAL_PHOTO_RESULT_KEY, JSON.stringify(result));
        showSavedPhotoResult(result);
      } catch(error) {
        const connectionHint = error instanceof TypeError ? ' Check the LumaBooth server connection.' : '';
        status.textContent = `Photo not saved: ${error.message}${connectionHint}`;
      }
    }

    function shareAction(method) {
      if (method === 'Email') {
        const email = prompt("Enter your email address to receive your photo:");
        if (email) alert(`Photo sent to ${email}!`);
      } else if (method === 'SMS') {
        const phone = prompt("Enter your phone number:");
        if (phone) alert(`Photo sent to ${phone}!`);
      } else if (method === 'QR Code') {
        if (!savedFinalPhoto) {
          alert('The final photo is not saved yet.');
          return;
        }
        document.getElementById('qr-download-dialog').showModal();
      }
    }

    window.shareAction = shareAction;
  </script>
