<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapNest (dslrBooth) - Capture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Top Titlebar */
    .titlebar {
      height: 38px;
      background-color: #121113;
      border-bottom: 1px solid #1f1e21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      background-color: #f85b00;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #928f95;
    }

    .window-btn {
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: color 0.2s;
    }

    .window-btn:hover {
      color: #ffffff;
    }

    /* Live Capture Stage */
    .capture-viewport {
      position: relative;
      width: 100vw;
      height: calc(100vh - 38px);
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Webcam Video Feed */
    #webcam-stream {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: none;
  z-index: 1;
}

    /* Top Left Cancel 'X' Button */
    .btn-exit-capture {
      position: absolute;
      top: 24px;
      left: 36px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 10;
      padding: 8px;
    }

    .btn-exit-capture svg {
      width: 44px;
      height: 44px;
      stroke: #f85b00;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      transition: stroke 0.2s;
    }

    .btn-exit-capture:hover svg {
      stroke: #f14f8a;
    }

    /* Circular Countdown Overlay */
    .countdown-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Translucent background disc */
    .countdown-bg {
      position: absolute;
      width: 210px;
      height: 210px;
      background: rgba(185, 185, 190, 0.55);
      border-radius: 50%;
      backdrop-filter: blur(2px);
    }

    /* SVG Progress Ring */
    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 250px;
      height: 250px;
      transform: rotate(-90deg);
    }

    .progress-ring-circle {
      stroke: #f85b00;
      stroke-width: 5;
      fill: transparent;
      stroke-dasharray: 691; /* 2 * PI * 110 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    /* Countdown Digit */
    .countdown-number {
      position: relative;
      font-size: 110px;
      font-weight: 500;
      color: #f85b00;
      z-index: 2;
      line-height: 1;
    }

    .shot-progress {
      position: absolute;
      top: 28px;
      z-index: 2;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    /* Camera Flash FX */
    .flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.15s ease-out;
    }

    .flash-overlay.trigger {
      opacity: 1;
    }

    .capture-status {
      position: absolute;
      bottom: 28px;
      z-index: 10;
      color: #ffffff;
      font-size: 14px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    /* Hidden Processing Canvas */
    #photo-canvas {
      display: none;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>

  <!-- Window Titlebar -->
  <header class="titlebar">
    <div class="brand">
      <div class="brand-logo">🐾</div>
      <span>SnapNest (dslrBooth) - Capture</span>
    </div>
    <div class="window-controls">
      <span class="window-btn" title="Minimize">—</span>
      <span class="window-btn" title="Maximize">▢</span>
      <span class="window-btn" title="Close" onclick="window.location.href='template.html'">✕</span>
    </div>
  </header>

  <!-- Live Camera Viewport -->
  <main class="capture-viewport">

    <!-- Exit Capture Button -->
    <button class="btn-exit-capture" onclick="window.location.href='template.html'" title="Cancel Capture">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Webcam Video Feed -->
    <video id="webcam-stream" autoplay playsinline muted></video>

    <!-- Circular Progress & Countdown -->
    <div class="countdown-wrapper" id="countdown-container">
      <div class="countdown-bg"></div>
      <svg class="progress-ring">
        <circle 
          class="progress-ring-circle" 
          id="progress-circle"
          cx="125" 
          cy="125" 
          r="110"
        />
      </svg>
      <div class="shot-progress" id="shot-progress"></div>
      <div class="countdown-number" id="countdown-val">3</div>
    </div>

    <!-- White Flash Animation -->
    <div class="flash-overlay" id="flash-screen"></div>
    <p class="capture-status" id="capture-status" role="status" aria-live="polite"></p>

    <!-- Hidden Canvas used for taking photo -->
    <canvas id="photo-canvas"></canvas>
  </main>

  <script type="module">
    const video = document.getElementById('webcam-stream');
    const countdownVal = document.getElementById('countdown-val');
    const shotProgress = document.getElementById('shot-progress');
    const progressCircle = document.getElementById('progress-circle');
    const flashScreen = document.getElementById('flash-screen');
    const canvas = document.getElementById('photo-canvas');
    const PHOTO_DB_NAME = 'lumabooth_db';
    const PHOTO_DB_VERSION = 2;
    const PHOTO_ASSET_STORE = 'photo_assets';
    const LATEST_PHOTO_ID = 'last-captured-photo';
    const ACTIVE_KEY = 'lumabooth_active_template_v2';
    const ACTIVE_EVENT_KEY = 'lumabooth_active_event_v1';
    const CAMERA_DEVICE_KEY = 'lumabooth_camera_device_v1';
    const CAPTURE_PHOTO_IDS_KEY = 'lumabooth_capture_photo_ids_v1';
    const CAPTURE_SESSION_ID_KEY = 'lumabooth_capture_session_id_v1';

    const totalCircumference = 2 * Math.PI * 110; // ~691px
    progressCircle.style.strokeDasharray = `${totalCircumference} ${totalCircumference}`;

    let secondsLeft = 3;
    const initialSeconds = 3;
    let shotNumbers = [1];
    let shotIndex = 0;
    const cloudUploadTasks = [];
    const captureSessionId = `session-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

    function loadShotNumbers() {
      try {
        const template = JSON.parse(localStorage.getItem(ACTIVE_KEY) || 'null');
        const cameras = (template?.layers || [])
          .filter(layer => layer.type === 'camera' && layer.visible !== false)
          .map((layer, index) => Number(layer.cameraNumber) || index + 1)
          .filter((cameraNumber, index, numbers) => numbers.indexOf(cameraNumber) === index)
          .sort((first, second) => first - second);
        if (cameras.length) shotNumbers = cameras;
      } catch(e) {}
      try { sessionStorage.removeItem(CAPTURE_PHOTO_IDS_KEY); } catch(e) {}
      try { sessionStorage.removeItem('lumabooth_final_photo_result_v1'); } catch(e) {}
      try { sessionStorage.removeItem('lumabooth_cloud_upload_failures_v1'); } catch(e) {}
      try { sessionStorage.removeItem('lumabooth_cloud_upload_error_v1'); } catch(e) {}
      try { sessionStorage.removeItem('lumabooth_selected_share_photo'); } catch(e) {}
      try { sessionStorage.setItem(CAPTURE_SESSION_ID_KEY, captureSessionId); } catch(e) {}
    }

    // 1. Initialize Camera
    async function startCamera() {
      try {
        const selectedDeviceId = localStorage.getItem(CAMERA_DEVICE_KEY) || '';
        const videoConstraints = {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          ...(selectedDeviceId
            ? { deviceId: { exact: selectedDeviceId } }
            : { facingMode: 'user' })
        };
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        } catch(error) {
          if (!selectedDeviceId) throw error;
          console.warn('Selected camera is unavailable; using the default camera:', error);
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' },
            audio: false
          });
        }
        video.srcObject = stream;
        runCountdown();
      } catch (err) {
        console.warn("Camera could not be accessed:", err);
        // Still run countdown with fallback placeholder so testing never hangs
        runCountdown();
      }
    }

    // 2. Countdown Timer Loop
    function runCountdown() {
      shotProgress.textContent = `Photo ${shotIndex + 1} of ${shotNumbers.length}`;
      countdownVal.textContent = secondsLeft;
      updateProgress(secondsLeft);

      const timer = setInterval(() => {
        secondsLeft--;

        if (secondsLeft > 0) {
          countdownVal.textContent = secondsLeft;
          updateProgress(secondsLeft);
        } else {
          clearInterval(timer);
          countdownVal.textContent = '';
          document.getElementById('countdown-container').style.display = 'none';
          triggerShutterFlash();
        }
      }, 1000);
    }

    function updateProgress(remaining) {
      const progressRatio = remaining / initialSeconds;
      const offset = totalCircumference * (1 - progressRatio);
      progressCircle.style.strokeDashoffset = offset;
    }

    function persistCapturedPhoto(data, cameraNumber) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(PHOTO_DB_NAME, PHOTO_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('templates')) db.createObjectStore('templates', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('design_drafts')) db.createObjectStore('design_drafts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains(PHOTO_ASSET_STORE)) db.createObjectStore(PHOTO_ASSET_STORE, { keyPath: 'id' });
        };
        request.onerror = () => reject(request.error || new Error('Photo database could not be opened.'));
        request.onsuccess = () => {
          const db = request.result;
          const capturedAt = Date.now();
          const photoId = `photo-${capturedAt}-${Math.random().toString(36).slice(2, 9)}`;
          try {
            const transaction = db.transaction(PHOTO_ASSET_STORE, 'readwrite');
            const store = transaction.objectStore(PHOTO_ASSET_STORE);
            store.put({ id: photoId, data, capturedAt, captureSessionId, cameraNumber });
            store.put({ id: LATEST_PHOTO_ID, galleryRecordId: photoId, capturedAt });
            transaction.oncomplete = () => { db.close(); resolve(photoId); };
            transaction.onerror = () => { db.close(); reject(transaction.error || new Error('Photo could not be saved.')); };
            transaction.onabort = () => { db.close(); reject(transaction.error || new Error('Photo save was interrupted.')); };
          } catch(error) {
            db.close();
            reject(error);
          }
        };
      });
    }

    function canvasToJpegBlob() {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Photo could not be encoded.')), 'image/jpeg', 0.92);
      });
    }

    // 3. Capture each numbered camera frame before opening the share page.
    async function triggerShutterFlash() {
      flashScreen.classList.add('trigger');

      // Set canvas dimensions
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      if (video.srcObject) {
  // Capture the actual camera view without mirroring
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
} else {
        // Fallback placeholder if no webcam attached
        ctx.fillStyle = '#201f22';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f85b00';
        ctx.font = 'bold 50px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('dslrBooth Guest Shot', canvas.width / 2, canvas.height / 2);
      }

      // Keep the latest image available to Share, and retain every capture in IndexedDB.
      const capturedPhoto = canvas.toDataURL('image/png');
      let savedPhotoId = null;
      try {
        savedPhotoId = await persistCapturedPhoto(capturedPhoto, shotNumbers[shotIndex]);
      } catch(error) {
        console.warn('Photo history could not be saved:', error);
      }
      const cloudUploadTask = (async () => {
        try {
          const { uploadPhoto } = await import('./supabase.js');
          const photoBlob = await canvasToJpegBlob();
          const activeEvent = JSON.parse(localStorage.getItem(ACTIVE_EVENT_KEY) || 'null');
          if (!activeEvent?.name) throw new Error('Launch a named event before uploading photos.');
          await uploadPhoto(photoBlob, captureSessionId, activeEvent.name);
        } catch(error) {
          console.warn('Photo could not be uploaded to Supabase:', error);
          try {
            sessionStorage.setItem('lumabooth_cloud_upload_error_v1', String(error?.message || 'Upload failed').slice(0, 160));
            const failures = Number(sessionStorage.getItem('lumabooth_cloud_upload_failures_v1') || 0);
            sessionStorage.setItem('lumabooth_cloud_upload_failures_v1', String(failures + 1));
          } catch(e) {}
        }
      })();
      cloudUploadTasks.push(cloudUploadTask);
      if (savedPhotoId) {
        try {
          const photoIds = JSON.parse(sessionStorage.getItem(CAPTURE_PHOTO_IDS_KEY) || '[]');
          photoIds.push(savedPhotoId);
          sessionStorage.setItem(CAPTURE_PHOTO_IDS_KEY, JSON.stringify(photoIds));
        } catch(e) {}
      }

      setTimeout(async () => {
        flashScreen.classList.remove('trigger');
        shotIndex++;
        if (shotIndex < shotNumbers.length) {
          secondsLeft = initialSeconds;
          document.getElementById('countdown-container').style.display = 'flex';
          runCountdown();
          return;
        }

        document.getElementById('capture-status').textContent = 'Finishing photo uploads...';
        await Promise.all(cloudUploadTasks);

        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
        }
        window.location.href = 'share.html';
      }, 300);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadShotNumbers();
      startCamera();
    });
  </script>
  <script src="kiosk-lock.js"></script>
</body>
</html>
