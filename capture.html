<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaBooth (dslrBooth) - Capture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Top Titlebar */
    .titlebar {
      height: 38px;
      background-color: #121113;
      border-bottom: 1px solid #1f1e21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      background-color: #d82b6b;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #928f95;
    }

    .window-btn {
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: color 0.2s;
    }

    .window-btn:hover {
      color: #ffffff;
    }

    /* Live Capture Stage */
    .capture-viewport {
      position: relative;
      width: 100vw;
      height: calc(100vh - 38px);
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Webcam Video Feed */
    #webcam-stream {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror view for selfie experience */
      z-index: 1;
    }

    /* Top Left Cancel 'X' Button */
    .btn-exit-capture {
      position: absolute;
      top: 24px;
      left: 36px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 10;
      padding: 8px;
    }

    .btn-exit-capture svg {
      width: 44px;
      height: 44px;
      stroke: #d82b6b;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      transition: stroke 0.2s;
    }

    .btn-exit-capture:hover svg {
      stroke: #f14f8a;
    }

    /* Circular Countdown Overlay */
    .countdown-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Translucent background disc */
    .countdown-bg {
      position: absolute;
      width: 210px;
      height: 210px;
      background: rgba(185, 185, 190, 0.55);
      border-radius: 50%;
      backdrop-filter: blur(2px);
    }

    /* SVG Progress Ring */
    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 250px;
      height: 250px;
      transform: rotate(-90deg);
    }

    .progress-ring-circle {
      stroke: #d82b6b;
      stroke-width: 5;
      fill: transparent;
      stroke-dasharray: 691; /* 2 * PI * 110 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    /* Countdown Digit */
    .countdown-number {
      position: relative;
      font-size: 110px;
      font-weight: 500;
      color: #d82b6b;
      z-index: 2;
      line-height: 1;
    }

    /* Camera Flash FX */
    .flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.15s ease-out;
    }

    .flash-overlay.trigger {
      opacity: 1;
    }

    /* Hidden Processing Canvas */
    #photo-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Window Titlebar -->
  <header class="titlebar">
    <div class="brand">
      <div class="brand-logo">🐾</div>
      <span>LumaBooth (dslrBooth) - Capture</span>
    </div>
    <div class="window-controls">
      <span class="window-btn" title="Minimize">—</span>
      <span class="window-btn" title="Maximize">▢</span>
      <span class="window-btn" title="Close" onclick="window.location.href='template.html'">✕</span>
    </div>
  </header>

  <!-- Live Camera Viewport -->
  <main class="capture-viewport">

    <!-- Exit Capture Button -->
    <button class="btn-exit-capture" onclick="window.location.href='template.html'" title="Cancel Capture">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Webcam Video Feed -->
    <video id="webcam-stream" autoplay playsinline muted></video>

    <!-- Circular Progress & Countdown -->
    <div class="countdown-wrapper" id="countdown-container">
      <div class="countdown-bg"></div>
      <svg class="progress-ring">
        <circle 
          class="progress-ring-circle" 
          id="progress-circle"
          cx="125" 
          cy="125" 
          r="110"
        />
      </svg>
      <div class="countdown-number" id="countdown-val">3</div>
    </div>

    <!-- White Flash Animation -->
    <div class="flash-overlay" id="flash-screen"></div>

    <!-- Hidden Canvas used for taking photo -->
    <canvas id="photo-canvas"></canvas>
  </main>

  <script>
    const video = document.getElementById('webcam-stream');
    const countdownVal = document.getElementById('countdown-val');
    const progressCircle = document.getElementById('progress-circle');
    const flashScreen = document.getElementById('flash-screen');
    const canvas = document.getElementById('photo-canvas');

    const totalCircumference = 2 * Math.PI * 110; // ~691px
    progressCircle.style.strokeDasharray = `${totalCircumference} ${totalCircumference}`;

    let secondsLeft = 3;
    const initialSeconds = 3;

    // 1. Initialize Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        runCountdown();
      } catch (err) {
        console.warn("Camera could not be accessed:", err);
        // Still run countdown with fallback placeholder so testing never hangs
        runCountdown();
      }
    }

    // 2. Countdown Timer Loop
    function runCountdown() {
      updateProgress(secondsLeft);

      const timer = setInterval(() => {
        secondsLeft--;

        if (secondsLeft > 0) {
          countdownVal.textContent = secondsLeft;
          updateProgress(secondsLeft);
        } else {
          clearInterval(timer);
          countdownVal.textContent = '';
          document.getElementById('countdown-container').style.display = 'none';
          triggerShutterFlash();
        }
      }, 1000);
    }

    function updateProgress(remaining) {
      const progressRatio = remaining / initialSeconds;
      const offset = totalCircumference * (1 - progressRatio);
      progressCircle.style.strokeDashoffset = offset;
    }

    // 3. Shutter Flash, Capture to Canvas, Save to sessionStorage & Redirect
    function triggerShutterFlash() {
      flashScreen.classList.add('trigger');

      // Set canvas dimensions
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      if (video.srcObject) {
        // Mirror the snapshot so it matches what user sees on screen
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } else {
        // Fallback placeholder if no webcam attached
        ctx.fillStyle = '#201f22';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#d82b6b';
        ctx.font = 'bold 50px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('dslrBooth Guest Shot', canvas.width / 2, canvas.height / 2);
      }

      // Convert captured photo to DataURL and save into sessionStorage
      const capturedPhoto = canvas.toDataURL('image/png');
      sessionStorage.setItem('lastCapturedPhoto', capturedPhoto);

      // Stop camera stream tracks to free webcam
      if (video.srcObject) {
        const stream = video.srcObject;
        stream.getTracks().forEach(track => track.stop());
      }

      // Briefly trigger flash and go directly to share.html
      setTimeout(() => {
        flashScreen.classList.remove('trigger');
        window.location.href = 'share.html';
      }, 300);
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
