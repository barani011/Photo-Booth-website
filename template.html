<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaBooth (dslrBooth) - Start - Choose Template</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0b0d;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Hide scrollbar for carousel */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between items-center py-6 px-10 relative bg-[#0b0b0d] overflow-hidden select-none">

  <!-- Top Window Title Bar -->
  <header class="absolute top-0 left-0 w-full h-[38px] bg-[#121113] border-b border-[#232224] flex items-center justify-between px-4 text-xs z-50">
    <div class="flex items-center gap-3">
      <div class="w-[22px] h-[22px] bg-gradient-to-tr from-[#d82b6b] to-[#f43f5e] rounded flex items-center justify-center text-white shadow-sm font-bold">
        🐾
      </div>
      <span class="font-medium text-[#ececec]">LumaBooth (dslrBooth) - Start - Choose Template</span>
    </div>
    <div class="flex items-center gap-4 text-[#928f95]">
      <span class="hover:text-white cursor-pointer">—</span>
      <span class="hover:text-white cursor-pointer">▢</span>
      <span class="hover:text-rose-500 cursor-pointer" onclick="window.location.href='kiosk.html'">✕</span>
    </div>
  </header>

  <!-- Top-Left Exit 'X' Button back to Photo Layout Editor -->
  <button onclick="window.location.href='photo-layout.html'" class="absolute top-12 left-8 bg-transparent border-0 cursor-pointer p-2 z-20 group" title="Return to Layout Editor">
    <svg class="w-10 h-10 stroke-[#d82b6b] group-hover:stroke-[#f43f5e] stroke-[3] fill-none transition-colors" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <!-- Title in Signature Pink -->
  <h2 class="text-3xl font-semibold text-[#d82b6b] tracking-tight mt-14">
    Choose a template
  </h2>

  <!-- Carousel populated live from Database -->
  <div class="relative w-full max-w-[1300px] flex items-center justify-center my-auto">
    <div id="kiosk-templates-carousel" class="no-scrollbar flex items-center gap-6 overflow-x-auto py-5 px-6 scroll-smooth w-full">
      <!-- Templates loaded dynamically from localStorage -->
    </div>

    <!-- Right Scroll Arrow Button -->
    <button onclick="scrollCarousel(300)" class="absolute -right-3 w-11 h-11 rounded-full bg-[#2a282d]/90 hover:bg-[#38363c] border border-[#48464d] text-white flex items-center justify-center cursor-pointer shadow-2xl transition z-10">
      <svg class="w-5 h-5 stroke-current stroke-[2.8] fill-none" viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Pagination Dots & Next Button -->
  <div class="flex flex-col items-center gap-4 mb-4">
    <div class="flex items-center gap-2" id="pagination-dots">
      <span class="w-2.5 h-2.5 rounded-full bg-[#d82b6b]"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-[#3d3b41]"></span>
    </div>

    <button onclick="proceedToCapture()" class="bg-[#d82b6b] hover:bg-[#be205b] active:scale-95 text-white font-semibold text-xl py-3.5 px-24 rounded-full shadow-lg shadow-[#d82b6b]/35 cursor-pointer border-0 transition-transform">
      Next
    </button>
  </div>

  <script>
    const STORAGE_KEY = 'lumabooth_saved_templates_v2';
    const ACTIVE_KEY = 'lumabooth_active_template_v2';
    const ACTIVE_ID_KEY = 'lumabooth_active_template_id_v1';
    const DB_NAME = 'lumabooth_db';
    const DB_VERSION = 2;
    const STORE_TEMPLATES = 'templates';
    const STORE_DRAFTS = 'design_drafts';
    const STORE_ASSETS = 'photo_assets';

    let savedTemplates = [];
    let selectedTemplate = null;

    function loadTemplatesFromDatabase() {
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_TEMPLATES)) {
            db.createObjectStore(STORE_TEMPLATES, { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains(STORE_DRAFTS)) {
            db.createObjectStore(STORE_DRAFTS, { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains(STORE_ASSETS)) {
            db.createObjectStore(STORE_ASSETS, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => {
          const db = request.result;
          const transaction = db.transaction(STORE_TEMPLATES, 'readonly');
          const templatesRequest = transaction.objectStore(STORE_TEMPLATES).getAll();
          templatesRequest.onsuccess = () => {
            resolve(templatesRequest.result || []);
            db.close();
          };
          templatesRequest.onerror = () => {
            resolve([]);
            db.close();
          };
        };
        request.onerror = () => resolve([]);
      });
    }

    async function loadTemplates() {
      try {
        savedTemplates = await loadTemplatesFromDatabase();
      } catch(e) {
        savedTemplates = [];
      }

      if (savedTemplates.length === 0) {
        try {
          savedTemplates = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch(e) {
          savedTemplates = [];
        }
      }

      try {
        const activeStored = localStorage.getItem(ACTIVE_KEY);
        const activeTemplate = activeStored ? JSON.parse(activeStored) : null;
        selectedTemplate = savedTemplates.find((tpl) => tpl.id === activeTemplate?.id)
          || activeTemplate
          || savedTemplates[0]
          || null;
      } catch(e) {
        selectedTemplate = savedTemplates[0] || null;
      }

      renderCarousel();
    }

    function renderCarousel() {
      const carousel = document.getElementById('kiosk-templates-carousel');
      carousel.innerHTML = '';

      if (savedTemplates.length === 0) {
        carousel.innerHTML = `
          <div class="w-full text-center text-zinc-500 py-12">
            No saved templates found. Please create one in <a href="photo-layout.html" class="text-[#d82b6b] underline">Photo Layout Editor</a>.
          </div>
        `;
        return;
      }

      savedTemplates.forEach((tpl) => {
        const card = document.createElement('div');
        const isSelected = selectedTemplate && selectedTemplate.id === tpl.id;

        card.className = `relative flex-shrink-0 w-[185px] h-[340px] rounded-2xl cursor-pointer transition-all duration-200 bg-white p-2.5 overflow-hidden flex flex-col justify-between shadow-2xl ${
          isSelected ? 'ring-4 ring-[#d82b6b] scale-[1.02]' : 'hover:scale-[1.01] opacity-90 hover:opacity-100'
        }`;

        card.innerHTML = `
          <div class="w-full h-full rounded-xl overflow-hidden flex items-center justify-center bg-gray-50">
            <img src="${tpl.thumbnailDataUri || ''}" alt="${tpl.title}" class="w-full h-full object-contain pointer-events-none">
          </div>

          <!-- Selection Badge -->
          <div class="absolute bottom-3 right-3 w-7 h-7 rounded-full bg-[#d82b6b] text-white items-center justify-center shadow-md ${
            isSelected ? 'flex' : 'hidden'
          }">
            <svg class="w-4 h-4 stroke-white stroke-[3] fill-none" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        `;

        card.onclick = () => {
          selectedTemplate = tpl;
          try {
            localStorage.setItem(ACTIVE_KEY, JSON.stringify(selectedTemplate));
          } catch(e) {}
          renderCarousel();
        };

        carousel.appendChild(card);
      });
    }

    function scrollCarousel(dist) {
      document.getElementById('kiosk-templates-carousel').scrollBy({ left: dist, behavior: 'smooth' });
    }

    function proceedToCapture() {
      if (selectedTemplate) {
        try {
          localStorage.setItem(ACTIVE_KEY, JSON.stringify(selectedTemplate));
        } catch(e) {}
      }
      window.location.href = 'capture.html';
    }

    window.addEventListener('DOMContentLoaded', loadTemplates);
  </script>
</body>
</html>
